{{ define "main" }}
<section class="page-list">
  <h1>{{ .Title }}</h1>
  <ol class="log">
    {{ range .Pages }}
    <li class="list-row">
      {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ else }}<span></span>{{ end }}
      <div class="log-body">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </div>
    </li>
    {{ end }}
  </ol>
</section>
{{ end }}
